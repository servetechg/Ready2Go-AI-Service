# Local development stack: the API + its two backing stores (Weaviate + MongoDB).
# Both are self-hosted/open-source here for dev; production points at managed
# equivalents via .env. Python keeps its own `ai_*` collections inside the same
# MongoDB database as the app (default "ready2go"); no separate state DB.

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Local dev defaults (override via .env for staging/prod).
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: ready2go
      WEAVIATE_URL: http://weaviate:8080
    depends_on:
      mongo:
        condition: service_healthy
      weaviate:
        condition: service_started

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.27.0
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
    volumes:
      - weaviate_data:/var/lib/weaviate

volumes:
  mongo_data:
  weaviate_data:
