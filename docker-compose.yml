# Dev stack: the API + a local Weaviate for vectors.
#
# MongoDB is NOT run locally — the service connects to the Atlas cluster defined
# by MONGODB_URI in .env (the same `ready2go` DB the Next.js app uses). Python
# keeps its own `ai_*` collections inside that DB; it never writes app domain docs.
# Weaviate is self-hosted here for dev; production points at a managed equivalent.

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # MONGODB_URI / MONGODB_DB come from .env (Atlas).
      # Only override what's container-specific:
      WEAVIATE_URL: http://weaviate:8080
      # No file-watch reload inside the container.
      RELOAD: "false"
    depends_on:
      weaviate:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.27.0
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
    volumes:
      - weaviate_data:/var/lib/weaviate

volumes:
  weaviate_data:
